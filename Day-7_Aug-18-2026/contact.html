<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index page</title>   
    <style>
        #contact-form{
            border: 2px solid black;
            width: 600px;
            height: 400px;
            margin-left: 300px;
            margin-top: 100px;
            padding: 20px;
        }
        table th,td{
            padding: 10px 20px;
        }
    </style>
</head>
<body>
        <div id="contact-form">
            <h1 style="text-align: center; font-size:40px">Contact Us!!!</h1><br><hr><br>
            <form>
                <table>
                    <tr>
                        <th><label>User Name</label></th>
                        <td>: <input type="text" minlength="3" value="subha" maxlength="40" id="name" name="name"></td>
                    </tr>
                    <tr>
                        <th><label>Email</label></th>
                        <td>: <input type="email" id="email" name="email"></td>
                    </tr>
                    <tr>
                        <th><label>Age</label></th>
                        <td>: <input type="number" min="18" max="25" id="age" name="age"></td>
                    </tr>
                    <tr>
                        <th><label>DOB</label></th>
                        <td>: <input type="date" id="dob" name="dob" max="2026-08-12"></td>
                    </tr>
                    <tr>
                        <td style="text-align: center;" colspan="2"><button type="submit" onclick="contactData()">Contact Us</button></td>
                    </tr>
                </table>
            </form>
        </div>
</body>
<script>
    function contactData(){
        let userName = document.getElementById('name').value;
        let userEmail = document.getElementById('email').value;
        let userAge = document.getElementById('age').value;
        let userDOB = document.getElementById('dob').value;
        localStorage.setItem("UserName" , userName);
        localStorage.setItem("UserEmail" , userEmail);
        localStorage.setItem("UserAge" , userAge);
        localStorage.setItem("UserDOB" , userDOB);
    }
</script>
</html>
