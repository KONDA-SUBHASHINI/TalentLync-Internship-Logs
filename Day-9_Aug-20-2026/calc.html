<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Javascript Calculator - v1</h1>
    <input type="number" placeholder="Param 1" name="param1" id="param1">
    <input type="number" placeholder="Param 2" name="param2" id="param2">
    <select name="options" id="calcOptions">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
        <option value="modulus">Modulus</option>
    </select>
    <input type="button" value="Calculate" onclick="doCalculations()">
    <hr>
    <p id="output"></p>
</body>
<script src="calc.js"></script>
</html>
