<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD operations</title>
</head>
<body>
    <form action="">
        <input type="text" name="name" id="name" placeholder="Enter your name">
        <input type="number" name="repos" id="repos" placeholder="Enter your repos count">
        <select name="branch" id="branch">
            <option value="cse">CSE</option>
            <option value="csm">CSM</option>
            <option value="csd">CSD</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="mec">MEC</option>
            <option value="civil">CIVIL</option>
        </select>
        <input type="number" id="marks" name="marks" placeholder="Enter your marks">
        <select name="status" id="status">
            <option value="choose">Choose</option>
            <option value="actice">Active</option>
            <option value="inactive">In-Actice</option>
        </select>
        <input type="button" value="Register" name="register" id="register">
        <input type="reset" value="Clear" name="reset" id="reset">
    </form><br>
    <button type="button" onclick="checkuserscount()">Get Users</button>
    <p id="result-cnt"></p>
</body>
<script src="student.js"></script>
</html>
