<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="register-styles.css">
</head>
<body>
    <div class="main-head">
        <div class="left-head">
            <h2 class="left-content" >Portfolio Builder</h2>
        </div>
        <div class="right-head">
            <br><br><br><br> 
            <h1 style="font-size: 24px; color:#4F46E5; text-align:center">Portfolio Builder Login</h1>
            <h2 style="margin-top:10px; font-size: 15px; text-align:center">Sign in to access your account</h2><br>
            <form action="portfolio-form.html">
                <table style="margin-left: 20px;">
                    <tr>
                        <th>Email</th>
                        <td> :<input class="input-fields" type="email" placeholder="Enter your email"></td>
                    </tr>
                    <tr>
                        <th>Password</th>
                        <td> :<input class="input-fields" type="password" minlength="8" maxlength="20" placeholder="Enter your password"></td>
                    </tr>
                    <tr>
                        <td style="text-align: center;" colspan="2"><input class="submit-btn" type="submit" name="" id=""></td>
                    </tr>
                </table>
            </form>
            <h4 class="link">Don't have an account? <span><a href="register.html">Register Here</a></span></h4>
        </div>
    </div>
</body>
</html>
